name: cluster-sql

# ============================================================================
# Stack de bases de datos para DESARROLLO
# Local por defecto; con BIND_ADDRESS también sirve a otras máquinas
# (servidor de la LAN, o acceso por VPN). Ver README -> "Acceso remoto".
#
# Probado en:
#   - macOS    -> OrbStack (Apple Silicon / Intel)
#   - Windows  -> Docker Desktop + backend WSL2
#   - Linux    -> Docker Engine nativo
#
# Decisiones de diseño:
#   - Sin resource limits: el runtime (OrbStack/Docker Desktop) ya gestiona la VM;
#     en Linux nativo no hay VM. Imponer límites molesta más de lo que ayuda.
#   - Alcance de los puertos controlado por BIND_ADDRESS (ver .env):
#     127.0.0.1 = solo esta máquina (por defecto) | 0.0.0.0 = LAN/internet
#     | <IP> = solo esa interfaz (p. ej. la de tu VPN).
#   - Backup como profile opcional: levantarlo solo cuando se necesite.
#   - Todas las imágenes son multi-arch (amd64 + arm64v8 / Apple Silicon).
#
# Bonus en OrbStack: cada servicio queda accesible vía
#   <servicio>.cluster-sql.orb.local (con HTTPS automático para los web).
# ============================================================================

x-common: &common
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

# Nota: 'security_opt: no-new-privileges' se aplica individualmente — NO al
# servicio pgadmin4. Su entrypoint usa sudo internamente y ese flag lo rompe
# (el "desktop user" no se crea y la UI responde 401 Unauthorized).

# Zona horaria: cada servicio acepta su propio override (POSTGRES_TZ,
# MARIADB_TZ, PMA_TZ, PGADMIN_TZ, BACKUP_TZ); si falta, usa el TZ global
# del .env; si tampoco, UTC. Normalmente basta con definir TZ una vez.

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # ==========================================================================
  # PostgreSQL 17 — base relacional principal (FastAPI, Laravel, etc.)
  # ==========================================================================
  postgres:
    <<: *common
    image: postgres:17-trixie
    container_name: postgres
    security_opt:
      - no-new-privileges:true
    ports:
      # El default 127.0.0.1 mantiene el puerto fuera de la red local/WiFi.
      # Para llegar desde otra máquina, define BIND_ADDRESS en tu .env.
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${POSTGRES_TZ:-${TZ:-UTC}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      <<: *healthcheck-defaults
      # -h 127.0.0.1 fuerza TCP: en el primer arranque el entrypoint levanta un
      # servidor temporal solo por socket mientras crea la base; sin -h, pg_isready
      # lo daría por listo y los dependientes arrancarían antes del reinicio final.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]

  # ==========================================================================
  # PostgreSQL + pgvector — alineado a PG17 (antes estaba mezclado con PG16)
  # ==========================================================================
  postgres-vector:
    <<: *common
    image: pgvector/pgvector:pg17-trixie
    container_name: postgres-vector
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_VECTOR_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_VECTOR_DB}
      TZ: ${POSTGRES_TZ:-${TZ:-UTC}}
    volumes:
      - pg_vector_data:/var/lib/postgresql/data
    networks:
      - db_network
    healthcheck:
      <<: *healthcheck-defaults
      # -h 127.0.0.1 fuerza TCP: en el primer arranque el entrypoint levanta un
      # servidor temporal solo por socket mientras crea la base; sin -h, pg_isready
      # lo daría por listo y los dependientes arrancarían antes del reinicio final.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]

  # ==========================================================================
  # pgAdmin 4 — corrige typo (pdAdmin4 -> pgadmin4)
  # ==========================================================================
  pgadmin4:
    <<: *common
    image: dpage/pgadmin4:9
    container_name: pgadmin4
    labels:
      # Le dice al reverse proxy de OrbStack a qué puerto del container apuntar.
      # Sin esto, cuando hay varios servicios HTTP en el mismo compose,
      # OrbStack a veces enruta los dominios .orb.local al container equivocado.
      dev.orbstack.http-port: "80"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      # False = desktop mode: login automático, cómodo para uso local individual.
      # True  = server mode: exige PGADMIN_DEFAULT_EMAIL + PASSWORD.
      # La documentación de pgAdmin avisa: "DO NOT DISABLE SERVER MODE IF RUNNING
      # ON A WEBSERVER!!" — si expones el puerto, pon PGADMIN_SERVER_MODE=True.
      PGADMIN_CONFIG_SERVER_MODE: "${PGADMIN_SERVER_MODE:-False}"
      # Solo aplica en desktop mode; en server mode se ignora.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      TZ: ${PGADMIN_TZ:-${TZ:-UTC}}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - db_network
    healthcheck:
      <<: *healthcheck-defaults
      # La imagen no trae curl; wget sí. /misc/ping responde sin autenticación.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:80/misc/ping" ]
      # pgAdmin tarda en inicializar su base interna en el primer arranque.
      start_period: 60s

  # ==========================================================================
  # MariaDB — para tus proyectos Laravel
  # La imagen oficial es multi-arch (amd64, arm64v8); funciona nativa en Apple Silicon.
  # ==========================================================================
  mariadb:
    <<: *common
    image: mariadb:lts-ubi9
    container_name: mariadb
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      TZ: ${MARIADB_TZ:-${TZ:-UTC}}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MARIADB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - db_network
    healthcheck:
      <<: *healthcheck-defaults
      # healthcheck.sh viene incluido en las imágenes oficiales modernas
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]

  # ==========================================================================
  # phpMyAdmin
  # La imagen oficial 'phpmyadmin' ya es multi-arch — no necesitas el tag arm64v8.
  # ==========================================================================
  phpmyadmin:
    <<: *common
    image: phpmyadmin:5
    container_name: phpmyadmin
    security_opt:
      - no-new-privileges:true
    labels:
      dev.orbstack.http-port: "80"
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PMA_PORT}:80"
    environment:
      PMA_HOST: mariadb
      # 1 = en la pantalla de login puedes conectarte a cualquier host MySQL/MariaDB.
      # Cómodo en local, pero expuesto convierte esta UI en un trampolín hacia
      # cualquier base alcanzable desde el container: pon PMA_ARBITRARY=0 en remoto.
      PMA_ARBITRARY: "${PMA_ARBITRARY:-1}"
      UPLOAD_LIMIT: 256M
      # Silencia el warning AH00558 de Apache (no afecta funcionalidad)
      APACHE_SERVER_NAME: phpmyadmin.local
      TZ: ${PMA_TZ:-${TZ:-UTC}}
    networks:
      - db_network
    healthcheck:
      <<: *healthcheck-defaults
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null http://localhost:80/" ]

  # ==========================================================================
  # Backup OPCIONAL — solo se levanta con: docker compose --profile backup up -d
  # Para desarrollo normal no es necesario; actívalo si vas a hacer trabajo
  # de varios días sin querer perder los datos.
  # La lógica vive en ./backup.sh (montado); los dumps quedan en ./backups/.
  # ==========================================================================
  backup:
    <<: *common
    image: postgres:17-alpine # trae pg_dump de PG17; el cliente de MariaDB lo instala backup.sh
    container_name: db-backup
    security_opt:
      - no-new-privileges:true
    profiles: [ "backup" ] # <-- clave: no arranca por defecto
    depends_on:
      postgres:
        condition: service_healthy
      postgres-vector:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      # Montado de solo lectura: editas backup.sh en el host y basta con
      # 'docker compose restart backup' para aplicarlo.
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    environment:
      # UID/GID solo aplica realmente en Linux nativo.
      # En Docker Desktop (macOS/Windows) la VM hace su propia traducción
      # y los archivos aparecerán con tu usuario del host automáticamente.
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      PGPASSWORD: ${POSTGRES_PASS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_VECTOR_DB: ${POSTGRES_VECTOR_DB}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400} # 24h
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      TZ: ${BACKUP_TZ:-${TZ:-UTC}}
    networks:
      - db_network
    entrypoint: [ "sh", "/usr/local/bin/backup.sh" ]

# ============================================================================
volumes:
  postgres_data:
  pg_vector_data:
  pgadmin_data:
  mariadb_data:

networks:
  db_network:
    driver: bridge
